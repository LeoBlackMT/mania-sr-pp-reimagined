name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 5

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # This repository deliberately contains no test code: correctness is verified from the
      # research repository, which owns the Python reference implementation, the golden vectors
      # and the dataset validator (see docs/usage.md). CI therefore checks formatting, lints and
      # the build.
      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --release --workspace

      # The algorithm crate must stay WebAssembly-ready: a future in-browser calculator depends on
      # it, and the usual way to break it is to enable a dependency feature that pulls in a
      # platform-specific crate (see docs/usage.md, FAQ).
      - name: Build for wasm32
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown -p mania-pp-algorithms
