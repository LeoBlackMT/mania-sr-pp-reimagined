name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 5

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # This repository deliberately contains no test code: correctness is verified from the
      # research repository, which owns the Python reference implementation, the golden vectors
      # and the dataset validator (see docs/usage.md). CI therefore checks formatting, lints and
      # the build.
      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --release --workspace

      # The site's calculator runs on WebAssembly, and the compiled module is committed under
      # `docs/wasm/` because GitHub Pages only serves static files. These two steps keep that
      # promise honest: the workspace must still build for wasm32, and the committed artefact must
      # be exactly what the current source produces (see docs/usage.md).
      - name: Build for wasm32
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --release --target wasm32-unknown-unknown -p mania-pp-algorithms -p mania-pp-wasm

      - name: Verify the committed WASM artefact is current
        run: |
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
          wasm-bindgen --target web --out-dir "$RUNNER_TEMP/wasm" --out-name mania_pp_wasm \
            target/wasm32-unknown-unknown/release/mania_pp_wasm.wasm
          if ! diff -r --brief docs/wasm "$RUNNER_TEMP/wasm"; then
            echo "::error::docs/wasm is out of date. Rebuild it with the command in docs/usage.md and commit the result."
            exit 1
          fi
