[workspace]
resolver = "2"
members = [
    "crates/mania-pp-spec",
    "crates/mania-pp-algorithms",
    "crates/mania-pp-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/LeoBlackMT/mania-sr-pp-reimagined"
authors = ["Leo_Black"]

[workspace.dependencies]
# The published fork that carries the Community Sunny algorithm and the Codexxy timing model as Rust
# modules. Pinned by revision so the comparison numbers are reproducible (`Cargo.lock` records it).
#
# No optional features are enabled on purpose: the fork's `reports` feature pulls in `crossterm`
# through `comfy-table`, which does not build for `wasm32-unknown-unknown` and would block a future
# WASM build. Everything needed here is unconditional public API of the fork
# (`mania::sunny::calculate` and `mania::sunny::calculate_performance`), and the mod string parser is
# implemented in this repository.
rosu-pp = { git = "https://github.com/ppy-sb/rosu-pp", rev = "3530ba7236038650d739d11e7e21e6641fe17dd0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1
