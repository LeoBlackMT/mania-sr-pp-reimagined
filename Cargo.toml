[workspace]
resolver = "2"
members = [
    "crates/mania-pp-wasm",
    "crates/mania-pp-spec",
    "crates/mania-pp-algorithms",
    "crates/mania-pp-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/LeoBlackMT/mania-sr-pp-reimagined"
authors = ["Leo_Black"]

[workspace.dependencies]
# The published fork that carries the Community Sunny algorithm and the Codexxy timing model as Rust
# modules. Pinned by revision so the comparison numbers are reproducible (`Cargo.lock` records it).
#
# No optional features are enabled on purpose: the fork's `reports` feature pulls in `crossterm`
# through `comfy-table`, which does not build for `wasm32-unknown-unknown` and would block a future
# WASM build. Everything needed here is unconditional public API of the fork
# (`mania::sunny::calculate` and `mania::sunny::calculate_performance`), and the mod string parser is
# implemented in this repository.
rosu-pp = { git = "https://github.com/ppy-sb/rosu-pp", rev = "3530ba7236038650d739d11e7e21e6641fe17dd0" }
# The untouched upstream crate, for the official osu!mania calculation only.
#
# The fork above does not compute the official star rating any more: its `mania::difficulty` fills
# `ManiaDifficultyAttributes.stars` from the Community Sunny ("rebirth") parameter computation, so
# feeding those attributes to the official pp formula yields "Sunny stars through the official pp
# curve", not Bancho. Upstream rosu-pp at the version the fork is based on still has the real strain
# skill, so the Bancho column is computed from that crate instead. Both crates coexist because they
# are separate dependencies of this workspace, not two versions of one dependency.
rosu-pp-official = { package = "rosu-pp", git = "https://github.com/MaxOhn/rosu-pp", rev = "27a67242cad155a2767f5a25a423ca4ec3e3c274" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
# Strip symbols from every release artefact: the WASM module is served to browsers and the native binaries gain nothing from debug sections.
strip = true
lto = "thin"
codegen-units = 1
